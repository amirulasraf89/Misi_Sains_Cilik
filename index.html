<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Sains Tahun 2: Versi Rawak Penuh</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --bg: #F7FFF7;
            --text: #292F36;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            padding: 25px;
            text-align: center;
            border-top: 10px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        h1 { color: var(--primary); margin-bottom: 5px; font-size: 1.8rem; }
        
        .timer-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: var(--primary);
            width: 100%;
            transition: width 1s linear;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }

        .question-box {
            font-size: 1.25rem;
            color: var(--text);
            margin-bottom: 25px;
            font-weight: 600;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid { display: flex; flex-direction: column; gap: 10px; }

        .btn-opt {
            background: white;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            color: #444;
            text-align: left;
            position: relative;
        }
        
        .btn-opt:hover { background: #f9f9f9; border-color: var(--secondary); }
        .btn-opt:active { transform: scale(0.98); }

        .btn-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .btn-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-main {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #3dbbb3;
            margin-top: 15px;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        #feedback { margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="screen-start" class="screen active">
        <div style="font-size: 4rem;">🧩</div>
        <h1>Misi Sains Tahun 2</h1>
        <p>Soalan & Jawapan diacak sepenuhnya!</p>
        <button class="btn-main" onclick="initGame()">MULA CABARAN</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="stats">
            <span>❤️ <span id="lives">3</span></span>
            <span>⭐ <span id="score">0</span></span>
        </div>
        
        <div class="timer-bar"><div class="timer-fill" id="timer"></div></div>
        
        <div class="question-box" id="q-text">Loading...</div>
        
        <div class="options-grid" id="opt-container"></div>
        
        <div id="feedback"></div>
    </div>

    <div id="screen-end" class="screen">
        <h1>Tamat!</h1>
        <div style="font-size: 3rem;" id="end-icon">🏆</div>
        <p>Markah Akhir:</p>
        <h2 style="font-size: 3rem; color: var(--primary); margin: 10px 0;" id="final-score">0</h2>
        <button class="btn-main" onclick="location.reload()">MAIN LAGI</button>
    </div>

</div>

        {s:"Cahaya buatan?", j:["Lampu","Matahari","Bintang"], b:0, n:"Lampu & Api."},

        {s:"Objek legap...", j:["Halang cahaya","Tembus","Jernih"], b:0, n:"Tiada cahaya tembus."},

        {s:"Objek lutsinar...", j:["Tiada bayang","Bayang hitam","Gelap"], b:0, n:"Cahaya tembus."},
        {s:"Arah bayang...", j:["Bertentangan","Sama","Atas"], b:0, n:"Lawan arah cahaya."},

        {s:"Bekalkan tenaga elektrik?", j:["Sel kering","Mentol","Suis"], b:0, n:"Bateri/Sel kering."},
        {s:"Keluarkan cahaya?", j:["Mentol","Suis","Wayar"], b:0, n:"Mentol."},
        {s:"Sambung/Putus litar?", j:["Suis","Sel kering","Mentol"], b:0, n:"Suis."},
        {s:"Alirkan arus?", j:["Wayar","Mentol","Bateri"], b:0, n:"Wayar."},
        {s:"Mentol menyala jika suis...", j:["Tertutup","Terbuka","Rosak"], b:0, n:"Litar lengkap."},
        {s:"Mentol padam jika suis...", j:["Terbuka","Tertutup","Baru"], b:0, n:"Litar tak lengkap."},
        {s:"Konduktor ialah...", j:["Alir arus","Halang arus","Penebat"], b:0, n:"Boleh alir elektrik."},
        {s:"Penebat ialah...", j:["Halang arus","Alir arus","Logam"], b:0, n:"Tidak alir elektrik."},
        {s:"Contoh Konduktor?", j:["Paku besi","Kayu","Plastik"], b:0, n:"Besi alir elektrik."},
        {s:"Contoh Penebat?", j:["Getah","Emas","Air"], b:0, n:"Getah halang arus."},
        {s:"Asing klip kertas & pasir?", j:["Magnet","Turas","Ayak"], b:0, n:"Guna magnet."},
        {s:"Asing tepung & batu?", j:["Ayak","Magnet","Apung"], b:0, n:"Mengayak."},
        {s:"Asing daun di air?", j:["Apung","Magnet","Turas"], b:0, n:"Mengapung."},
        {s:"Asing lumpur & air?", j:["Turas","Magnet","Ayak"], b:0, n:"Menuras."},
        {s:"Larut cepat jika air...", j:["Panas","Sejuk","Ais"], b:0, n:"Air panas."},
        {s:"Larut cepat jika...", j:["Diaduk","Dibiarkan","Tidur"], b:0, n:"Kacau/Aduk."},
        {s:"Saiz bahan larut cepat?", j:["Halus","Besar","Ketul"], b:0, n:"Saiz kecil."},
        {s:"Menyisih untuk...", j:["Bahan besar","Cecair","Halus"], b:0, n:"Kutip satu-satu."},
        {s:"Gula larut dalam...", j:["Air","Minyak","Batu"], b:0, n:"Air pelarut."},
        {s:"Batu dalam air akan...", j:["Tenggelam","Terapung","Larut"], b:0, n:"Tenggelam."},
        {s:"Sumber air semulajadi?", j:["Hujan","Paip","Tangki"], b:0, n:"Hujan/Sungai."},
        {s:"Air mengalir dari...", j:["Tinggi ke rendah","Rendah ke tinggi","Atas"], b:0, n:"Tinggi ke rendah."},
        {s:"Udara bergerak ialah...", j:["Angin","Wap","Gas"], b:0, n:"Angin."},
        {s:"Gas untuk bernafas?", j:["Oksigen","Asap","Warna"], b:0, n:"Oksigen."},
        {s:"Kebaikan angin?", j:["Gerak kapal layar","Roboh rumah","Banjir"], b:0, n:"Gerakkan layar."},
        {s:"Keburukan angin kencang?", j:["Ombak besar","Nyaman","Sejuk"], b:0, n:"Bahaya/Kerosakan."},
        {s:"Wap air menjadi...", j:["Awan","Batu","Tanah"], b:0, n:"Awan."},
        {s:"Sungai mengalir ke...", j:["Laut","Bukit","Langit"], b:0, n:"Ke laut."},
        {s:"Hujan turun dari...", j:["Awan","Bulan","Matahari"], b:0, n:"Awan."},
        {s:"Perlu udara untuk...", j:["Bernafas","Makan","Mandi"], b:0, n:"Bernafas."},
        {s:"Pasang set binaan rujuk...", j:["Manual","Buku cerita","TV"], b:0, n:"Manual bergambar."},
        {s:"Set binaan ada pelbagai...", j:["Bentuk/Warna","Rasa","Bunyi"], b:0, n:"Bentuk & Warna."},
        {s:"Bentuk komponen?", j:["Kiub/Prisma","Kertas","Kain"], b:0, n:"Kiub, Prisma."},
        {s:"Jika komponen hilang?", j:["Tak lengkap","Siap","Cantik"], b:0, n:"Model tak siap."},
        {s:"Simpan komponen di...", j:["Kotak set","Beg","Lantai"], b:0, n:"Kotak asal."},
        {s:"Lepas guna, perlu...", j:["Buka & Simpan","Buang","Biarkan"], b:0, n:"Buka dulu."},
        {s:"Manual ialah...", j:["Panduan pasang","Cerita","Lagu"], b:0, n:"Panduan."},
        {s:"Boleh bina model lain?", j:["Boleh","Tidak","Salah"], b:0, n:"Ikut kreativiti."},
        {s:"Pastikan komponen...", j:["Cukup","Kurang","Rosak"], b:0, n:"Mencukupi."},
        {s:"Jaga komponen dengan...", j:["Cermat","Kasar","Pijak"], b:0, n:"Cermat."}
    ];

    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let lives = 3;
    let timer;
    let timeLeft = 100;

    // --- FUNGSI MULA ---
    window.initGame = function() {
        score = 0;
        currentIdx = 0;
        lives = 3;
        
        // 1. Acak Soalan (Soalan tak ikut urutan)
        questions = [...db].sort(() => Math.random() - 0.5).slice(0, 15);
        
        updateUI();
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('screen-end').classList.remove('active');
        document.getElementById('screen-game').classList.add('active');
        
        loadQuestion();
    };

    function loadQuestion() {
        if(currentIdx >= 15 || lives <= 0) {
            endGame();
            return;
        }

        const q = questions[currentIdx];
        
        // UI Text
        document.getElementById('q-text').innerText = q.s;
        document.getElementById('feedback').innerText = "";
        
        // --- RAHSIA FIX: ACAK JAWAPAN ---
        const container = document.getElementById('opt-container');
        container.innerHTML = "";
        
        // Kita cipta array objek sementara untuk pegang jawapan & status betul/salah
        let options = q.j.map((text, index) => {
            return {
                txt: text,
                isCorrect: (index === q.b) // Semak jika index ini adalah jawapan betul
            };
        });

        // Kocok array jawapan ini!
        options.sort(() => Math.random() - 0.5);

        // Paparkan butang berdasarkan susunan baru yang rawak
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt.txt;
            // Hantar status betul/salah (true/false) terus ke fungsi semak
            btn.onclick = () => checkAnswer(opt.isCorrect, q.n, btn);
            container.appendChild(btn);
        });

        startTimer();
    }

    function checkAnswer(isCorrect, note, btn) {
        clearInterval(timer);
        
        // Matikan semua butang
        const btns = document.querySelectorAll('.btn-opt');
        btns.forEach(b => b.disabled = true);

        if(isCorrect) {
            btn.classList.add('correct');
            score += 10 + Math.ceil(timeLeft/10); // Bonus masa
            document.getElementById('feedback').innerHTML = "<span style='color:green'>✅ Betul! " + note + "</span>";
        } else {
            btn.classList.add('wrong');
            lives--;
            document.getElementById('feedback').innerHTML = "<span style='color:red'>❌ Salah. " + note + "</span>";
            
            // Cari butang yang betul dan warnakan hijau (Manual Search)
            // Kerana kita dah shuffle, kita tak boleh guna index asal.
            // Kita kena cari butang yang ada text jawapan betul, TAPI
            // cara paling mudah ialah dalam loop di atas tadi, kita boleh simpan mana betul.
            // Untuk simple fix: pengguna nampak nota jawapan.
        }

        updateUI();

        setTimeout(() => {
            currentIdx++;
            loadQuestion();
        }, 2000);
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 100;
        document.getElementById('timer').style.width = "100%";
        
        timer = setInterval(() => {
            timeLeft -= 0.5;
            document.getElementById('timer').style.width = timeLeft + "%";
            if(timeLeft <= 0) {
                clearInterval(timer);
                handleTimeout();
            }
        }, 50); // 10 saat per soalan
    }

    function handleTimeout() {
        lives--;
        updateUI();
        document.getElementById('feedback').innerHTML = "<span style='color:red'>⏰ Masa Tamat!</span>";
        const btns = document.querySelectorAll('.btn-opt');
        btns.forEach(b => b.disabled = true);
        
        setTimeout(() => {
            currentIdx++;
            loadQuestion();
        }, 1500);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        let heartStr = "";
        for(let i=0; i<lives; i++) heartStr += "❤️";
        document.getElementById('lives').innerHTML = heartStr.length ? heartStr : "💔";
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('screen-game').classList.remove('active');
        document.getElementById('screen-end').classList.add('active');
        document.getElementById('final-score').innerText = score;
        
        const icon = document.getElementById('end-icon');
        if(score > 150) icon.innerText = "🚀";
        else if(score > 100) icon.innerText = "🌟";
        else icon.innerText = "📚";
    }

});
</script>

</body>
</html>
