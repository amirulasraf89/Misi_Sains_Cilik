<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Sains Tahun 2: Edisi Visual</title>
    <style>
        :root {
            --primary: #FF7675;
            --secondary: #74B9FF;
            --bg: #F0F3F4;
            --card: #FFFFFF;
            --text: #2D3436;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            background: var(--card);
            width: 90%;
            max-width: 500px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            border: 5px solid var(--secondary);
            position: relative;
            overflow: hidden;
        }

        /* TIMER BAR */
        .timer-bar {
            height: 10px;
            background: #dfe6e9;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: var(--primary);
            width: 100%;
            transition: width 1s linear;
        }

        /* STATS */
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            color: #636e72;
            margin-bottom: 10px;
        }

        /* VISUAL AREA */
        .visual-box {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            animation: popIn 0.5s;
        }
        
        .visual-emoji { font-size: 5rem; line-height: 1; }
        
        /* Jika guna gambar sebenar nanti */
        .visual-img { 
            max-height: 100%; 
            max-width: 100%; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* QUESTION */
        .question-box {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 60px;
        }

        /* OPTIONS */
        .options-grid { display: grid; gap: 10px; }

        .btn-opt {
            background: #f1f2f6;
            border: 2px solid #ced6e0;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text);
            font-family: inherit;
            font-weight: 600;
        }
        
        .btn-opt:hover { background: #dfe4ea; transform: scale(1.02); }
        .btn-opt:active { transform: scale(0.98); }

        .btn-opt.correct { background: #55efc4; border-color: #00b894; color: #006266; }
        .btn-opt.wrong { background: #ff7675; border-color: #d63031; color: #632c2c; }

        /* SCREENS */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s; }

        .btn-main {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #0984e3;
            margin-top: 15px;
            font-family: inherit;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        #feedback { margin-top: 10px; font-weight: bold; min-height: 25px; font-size: 1.1rem; }

        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    
    <div id="screen-start" class="screen active">
        <div style="font-size: 5rem; margin-bottom: 10px;">👨‍🚀</div>
        <h1 style="color: var(--secondary); margin:0;">Misi Sains Visual</h1>
        <p>100 Soalan Bergambar!</p>

    </div>

    <div id="screen-game" class="screen">

        <div class="options-grid" id="opt-container"></div>

        lives = 3;

        updateUI();
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('screen-end').classList.remove('active');
        document.getElementById('screen-game').classList.add('active');
        
        loadQuestion();
    };

    function loadQuestion() {
        if(currentIdx >= 15 || lives <= 0) {
            endGame();
            return;
        }

        const q = questions[currentIdx];
        
        // Papar Soalan
        document.getElementById('q-text').innerText = q.s;
        document.getElementById('feedback').innerText = "";
        
        // --- LOGIK VISUAL (Gambar atau Emoji) ---
        const visualBox = document.getElementById('q-visual');
        visualBox.innerHTML = ""; // Kosongkan
        
        if (q.img.includes("/") || q.img.includes(".")) {
            // Jika ia URL gambar (ada titik atau slash)
            let imgEl = document.createElement('img');
            imgEl.src = q.img;
            imgEl.className = "visual-img";
            visualBox.appendChild(imgEl);
        } else {
            // Jika ia Emoji
            let spanEl = document.createElement('span');
            spanEl.innerText = q.img;
            spanEl.className = "visual-emoji";
            visualBox.appendChild(spanEl);
        }

        // --- ACAK JAWAPAN ---
        const container = document.getElementById('opt-container');
        container.innerHTML = "";
        
        let options = q.j.map((text, index) => {
            return { txt: text, isCorrect: (index === q.b) };
        });

        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = opt.txt;
            btn.onclick = () => checkAnswer(opt.isCorrect, q.n, btn);
            container.appendChild(btn);
        });

        startTimer();
    }

    function checkAnswer(isCorrect, note, btn) {
        clearInterval(timer);
        const btns = document.querySelectorAll('.btn-opt');
        btns.forEach(b => b.disabled = true);

        if(isCorrect) {
            btn.classList.add('correct');
            score += 10 + Math.ceil(timeLeft/10);
            document.getElementById('feedback').innerHTML = "<span style='color:green'>✅ Betul! " + note + "</span>";
        } else {
            btn.classList.add('wrong');
            lives--;
            document.getElementById('feedback').innerHTML = "<span style='color:red'>❌ Salah. " + note + "</span>";
        }

        updateUI();

        setTimeout(() => {
            currentIdx++;
            loadQuestion();
        }, 2000);
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 100;
        document.getElementById('timer').style.width = "100%";
        
        timer = setInterval(() => {
            timeLeft -= 0.5;
            document.getElementById('timer').style.width = timeLeft + "%";
            if(timeLeft <= 0) {
                clearInterval(timer);
                handleTimeout();
            }
        }, 50);
    }

    function handleTimeout() {
        lives--;
        updateUI();
        document.getElementById('feedback').innerHTML = "<span style='color:red'>⏰ Masa Tamat!</span>";
        const btns = document.querySelectorAll('.btn-opt');
        btns.forEach(b => b.disabled = true);
        
        setTimeout(() => {
            currentIdx++;
            loadQuestion();
        }, 1500);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        let heartStr = "";
        for(let i=0; i<lives; i++) heartStr += "❤️";
        document.getElementById('lives').innerHTML = heartStr.length ? heartStr : "💔";
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('screen-game').classList.remove('active');
        document.getElementById('screen-end').classList.add('active');
        document.getElementById('final-score').innerText = score;
        
        const icon = document.getElementById('end-icon');
        if(score > 150) icon.innerText = "🚀";
        else if(score > 100) icon.innerText = "🌟";
        else icon.innerText = "📚";
    }

});
</script>

</body>
</html>
