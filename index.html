<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Sains Tahun 2: Edisi Random</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #f72585;
            --success: #4cc9f0;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            background: white;
            width: 95%;
            max-width: 650px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            border: 4px solid var(--primary);
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 25px;
            text-align: center;
        }

        h1 { margin: 0; font-size: 1.8rem; }
        .subtitle { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }

        .game-area { padding: 20px; }
        
        /* Screens */
        .screen { display: none; text-align: center; }
        .screen.active { display: block; animation: popIn 0.4s ease-out; }

        /* Buttons */
        .btn-main {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b5179e;
            transition: transform 0.1s;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-main:active { transform: translateY(6px); box-shadow: none; }

        /* Question Styles */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .question-card {
            background: #eef4ff;
            border: 2px dashed var(--primary);
            padding: 25px;
            border-radius: 15px;
            font-size: 1.25rem;
            margin-bottom: 25px;
            color: #333;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .opt-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #444;
        }
        .opt-btn:hover { border-color: var(--primary); background: #f0f7ff; }
        
        .opt-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .opt-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>

    const playTone = (freq, type, duration) => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    };

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        score = 0;
        currentIndex = 0;
        // 1. Shuffle Bank Soalan Besar
        const shuffledBank = shuffle([...questionBank]);
        // 2. Ambil 15 soalan sahaja
        currentQuestions = shuffledBank.slice(0, TOTAL_Q_PER_SESSION);
        
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('end-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            endGame();
            return;
        }

        const q = currentQuestions[currentIndex];
        
        // Update UI
        document.getElementById('q-count').innerText = `Soalan: ${currentIndex + 1}/${TOTAL_Q_PER_SESSION}`;
        document.getElementById('score-disp').innerText = `Markah: ${score}`;
        document.getElementById('progress').style.width = `${((currentIndex) / TOTAL_Q_PER_SESSION) * 100}%`;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('feedback-note').innerText = "";

        // Create Options
        const container = document.getElementById('opt-container');
        container.innerHTML = '';
        
        q.o.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, q.a, btn, q.n);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, btn, note) {
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.disabled = true); // Lock buttons

        if (selected === correct) {
            btn.classList.add('correct');
            score += 10;
            playTone(600, 'sine', 0.2); // Happy sound
            document.getElementById('feedback-note').innerHTML = "✅ Betul! " + note;
        } else {
            btn.classList.add('wrong');
            btns[correct].classList.add('correct'); // Show correct one
            playTone(200, 'sawtooth', 0.3); // Sad sound
            document.getElementById('feedback-note').innerHTML = "❌ Salah. " + note;
        }

        document.getElementById('score-disp').innerText = `Markah: ${score}`;
        
        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 2000); // 2 saat masa untuk baca nota
    }

    function endGame() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('end-screen').classList.add('active');
        
        // Animation update
        let displayScore = 0;
        const scoreEl = document.getElementById('final-score');
        const interval = setInterval(() => {
            if (displayScore >= score) clearInterval(interval);
            scoreEl.innerText = displayScore;
            displayScore++;
        }, 20);

        const msg = document.getElementById('final-msg');
        if (score === 150) msg.innerText = "Sempurna! Kamu hebat! 🌟";
        else if (score >= 100) msg.innerText = "Syabas! Usaha yang baik! 👍";
        else msg.innerText = "Cuba lagi ya! 💪";
    }
</script>
